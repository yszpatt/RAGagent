services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kp}
      POSTGRES_DB: ${POSTGRES_DB:-knowledgepilot}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ../backend
    ports: ["8000:8000"]
    env_file: [../.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kp}:${POSTGRES_PASSWORD:-kp}@postgres:5432/${POSTGRES_DB:-knowledgepilot}
      REDIS_URL: redis://redis:6379
    depends_on: [postgres, redis]
  worker:
    build: ../backend
    command: ["rq", "worker", "ingestion"]
    env_file: [../.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kp}:${POSTGRES_PASSWORD:-kp}@postgres:5432/${POSTGRES_DB:-knowledgepilot}
      REDIS_URL: redis://redis:6379
    depends_on: [postgres, redis]
volumes:
  pgdata:
