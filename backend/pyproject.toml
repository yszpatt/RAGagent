[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledgepilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "langchain>=0.1.16",
    "langgraph>=0.0.30",
    "langchain-community>=0.0.36",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "psycopg2-binary>=2.9",
    "pgvector>=0.2.4",
    "redis>=5.0",
    "rq>=1.16",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "sentence-transformers>=2.6",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "markdown>=3.5",
    "aiofiles>=23.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "testcontainers>=4.4",
]
